<!doctype html>
<html lang="en-US">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Thank You &#8211; VCS Advisors</title>
	<link rel="icon" href="/wp-content/uploads/2025/04/VCS_Favicon_512x512-2-150x150.png" sizes="32x32">
	<link rel="stylesheet" href="/wp-content/uploads/elementor/google-fonts/css/poppins.css" media="all">
	<link rel="stylesheet" href="/wp-content/uploads/elementor/google-fonts/css/lora.css" media="all">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font-family: "Lora", serif;
			color: #2D2D2D;
			background: #F5F7FA;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}
		header {
			background: #ffffff;
			padding: 18px 6%;
			box-shadow: 0 1px 4px rgba(0,0,0,.06);
		}
		header img { height: 52px; width: auto; display: block; }
		main {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 60px 24px;
		}
		.card { max-width: 620px; text-align: center; }
		.card .check {
			width: 72px; height: 72px; border-radius: 50%;
			background: #3C78F0; color: #fff;
			font-size: 38px; line-height: 72px;
			margin: 0 auto 28px;
			font-family: "Poppins", sans-serif;
		}
		h1 {
			font-family: "Poppins", sans-serif;
			font-weight: 600;
			font-size: 34px;
			margin-bottom: 16px;
			color: #2D2D2D;
		}
		p { font-size: 18px; line-height: 1.7; margin-bottom: 36px; color: #6C757D; }
		.btn {
			display: inline-block;
			background: #3C78F0;
			color: #fff;
			font-family: "Poppins", sans-serif;
			font-size: 15px;
			font-weight: 600;
			text-transform: uppercase;
			text-decoration: none;
			border-radius: 20px;
			padding: 20px 45px;
			transition: background .3s;
		}
		.btn:hover { background: #6C72E6; }
		footer {
			background: #2D2D2D;
			color: #fff;
			font-family: "Poppins", sans-serif;
			font-size: 13px;
			text-align: center;
			padding: 22px 12px;
		}
	</style>
</head>
<body>
	<header>
		<a href="/"><img src="/wp-content/uploads/2025/04/VCS_Logo-350x100-1.png" alt="VCS Advisors — Valued C-Suite Advisors"></a>
	</header>
	<main>
		<div class="card">
			<div class="check">&#10003;</div>
			<h1>Thank You!</h1>
			<p>Your message has been sent. A member of the VCS Advisors team will get back to you shortly.</p>
			<a class="btn" href="/">Back to Home</a>
		</div>
	</main>
	<footer>VCS Advisors &mdash; Fractional C-Suite Leadership</footer>
</body>
</html>
