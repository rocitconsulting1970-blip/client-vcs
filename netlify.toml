[build]
  publish = "site"

# VCS Advisors — static site config

# Old WordPress URL that had inbound links; redirect to homepage contact section
[[redirects]]
  from = "/home-2/*"
  to = "/#Contact"
  status = 301

# WordPress backend endpoints that no longer exist — send to home
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/wp-json/*"
  to = "/"
  status = 301

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache immutable WordPress assets aggressively (filenames never change)
[[headers]]
  for = "/wp-content/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/wp-includes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
